#NOTA: Este código ha sido generado por Copilot.
services:
  # 1. Servidor Web (Apache + PHP 8.2)
  web:
    image: php:8.2-apache
    container_name: tablon_web
    ports:
      - "8080:80" # Entrarás en tu web mediante http://localhost:8080
    volumes:
      # Vincula tus carpetas locales con las del contenedor en tiempo real
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./config.php:/var/www/html/config.php
      - ./vendor:/var/www/html/vendor
    environment:
      # Le dice a Apache que el único directorio público accesible sea /public
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    networks:
      - red-tablon
    # Ejecuta comandos internos: activa la reescritura de URLs para el .htaccess,
    # instala la extensión PDO para MySQL y arranca Apache.
    # ---
    # NOTA: Se ha modificado este archivo otra vez porque al abrir el enlace http://localhost:8080/ se ha mostrado un mensaje de error.
    # Se suponde que dichas modificaciones harán que el programa funcione.
    command: > 
      bash -c "
      sed -ri -e 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/*.conf &&
      sed -ri -e 's!/var/www/!/var/www/html/public!g' /etc/apache2/apache2.conf /etc/apache2/conf-available/*.conf &&
      a2enmod rewrite &&
      docker-php-ext-install pdo pdo_mysql &&
      apache2-foreground"
  # 2. Base de datos (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: tablon_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura # Contraseña del usuario root
      MYSQL_DATABASE: tablon_anuncios        # Crea la base de datos automáticamente
    volumes:
      - datos_bd:/var/lib/mysql # Guarda los datos para que no se borren al apagar el contenedor
    networks:
      - red-tablon

  # 3. Interfaz Gráfica para la BD (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: tablon_pma
    ports:
      - "8081:80" # Entrarás mediante http://localhost:8081
    environment:
      PMA_HOST: db # Se conecta al servicio 'db' configurado arriba
      PMA_USER: root
      PMA_PASSWORD: root_password_segura
    networks:
      - red-tablon

# Volúmenes necesarios para la persistencia de datos
volumes:
  datos_bd:

# Red virtual interna para que los contenedores se comuniquen entre sí
networks:
  red-tablon:
    driver: bridge